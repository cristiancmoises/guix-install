name: Build Linux packages
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Debian tooling
        run: sudo apt-get update && sudo apt-get install -y debhelper fakeroot build-essential
      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b
      - name: Install and exercise Debian package
        run: |
          sudo apt-get install -y ../guix-install_*_all.deb
          guix-install --version
          guix-install plan --json > /tmp/guix-install-plan.json
          python3 -c 'import json; assert json.load(open("/tmp/guix-install-plan.json"))["executed"] is False'
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp ../guix-install_*_all.deb dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guix-install-deb
          path: dist/guix-install_*.deb
  rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install RPM tooling
        run: dnf install -y rpm-build git
      - name: Build .rpm
        run: |
          VERSION="$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' guix_installer/__init__.py)"
          mkdir -p rpmbuild/BUILD rpmbuild/RPMS rpmbuild/SOURCES \
            rpmbuild/SPECS rpmbuild/SRPMS rpmbuild/SOURCES/guix-install-${VERSION}
          cp -r guix_installer run.py vendor assets packaging \
            rpmbuild/SOURCES/guix-install-${VERSION}/
          tar -C rpmbuild/SOURCES -czf rpmbuild/SOURCES/guix-install-${VERSION}.tar.gz \
            guix-install-${VERSION}
          rpmbuild --define "_topdir $PWD/rpmbuild" -ba packaging/rpm/guix-install.spec
      - name: Install and exercise RPM package
        run: |
          dnf install -y --setopt=install_weak_deps=False rpmbuild/RPMS/noarch/guix-install-*.rpm
          guix-install --version
          guix-install plan --json > /tmp/guix-install-plan.json
          python3 -c 'import json; assert json.load(open("/tmp/guix-install-plan.json"))["executed"] is False'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guix-install-rpm
          path: rpmbuild/RPMS/noarch/guix-install-*.rpm
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Arch tooling
        run: pacman -Syu --noconfirm base-devel git python
      - name: Build Arch package
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c 'cd packaging/arch && makepkg -f'
      - name: Install and exercise Arch package
        run: |
          pacman -U --noconfirm packaging/arch/guix-install-*.pkg.tar.zst
          guix-install --version
          guix-install plan --json > /tmp/guix-install-plan.json
          python -c 'import json; assert json.load(open("/tmp/guix-install-plan.json"))["executed"] is False'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guix-install-arch
          path: packaging/arch/guix-install-*.pkg.tar.zst
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build portable tarball
        run: sh packaging/linux/build-portable.sh
      - name: Smoke test the relocatable bundle
        run: |
          mkdir -p /tmp/gi-smoke
          tar -xzf dist/guix-install-*-linux-x86_64.tar.gz -C /tmp/gi-smoke
          bundle_dir="$(find /tmp/gi-smoke -maxdepth 1 -type d -name 'guix-install-*-linux-x86_64' | head -1)"
          "${bundle_dir}/bin/guix-install" --version
          "${bundle_dir}/bin/guix-install" plan --help >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guix-install-portable
          path: dist/guix-install-*.tar.gz
