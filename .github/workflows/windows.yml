name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: '3.12'
      - name: Native build failure regression
        shell: powershell
        run: .\tests\windows_build_failures.ps1
      - name: Build GuixInstall.exe and GuixInstall.msi
        run: powershell -ExecutionPolicy Bypass -File windows/build-windows.ps1
      - name: Native virtual disk write and verification
        run: python tests/windows_runtime.py -v
      - name: Packaged CLI and MSI installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\dist\GuixInstall.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Executable version failed' }
          $license = & .\dist\GuixInstall.exe --license | Out-String
          if ($LASTEXITCODE -ne 0 -or $license -notmatch '17\. Interpretation') { throw 'Bundled license is incomplete' }
          $inventory = & .\dist\GuixInstall.exe list --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $inventory) { throw 'Executable inventory failed' }
          $result = Start-Process msiexec.exe -ArgumentList '/i', "$PWD\dist\GuixInstall.msi", '/qn', '/norestart' -Wait -PassThru
          if ($result.ExitCode -notin @(0, 3010)) { throw "MSI installation failed: $($result.ExitCode)" }
          try {
            $installed = Join-Path $env:ProgramFiles 'GNU Guix Installer\GuixInstall.exe'
            & $installed --version
            if ($LASTEXITCODE -ne 0) { throw 'Installed executable failed' }
            $licenseFile = Join-Path (Split-Path $installed) 'COPYING'
            if (-not (Test-Path -LiteralPath $licenseFile) -or (Get-Content -Raw $licenseFile) -notmatch '17\. Interpretation') { throw 'Installed license is incomplete' }
            $shortcut = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'GNU Guix Installer.lnk'
            if (-not (Test-Path -LiteralPath $shortcut)) { throw 'Machine-wide shortcut is missing' }
            $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
            if ($link.WorkingDirectory.TrimEnd('\') -ne (Split-Path $installed).TrimEnd('\')) { throw 'Shortcut working directory is incorrect' }
          } finally {
            $result = Start-Process msiexec.exe -ArgumentList '/x', "$PWD\dist\GuixInstall.msi", '/qn', '/norestart' -Wait -PassThru
            if ($result.ExitCode -notin @(0, 3010)) { throw "MSI removal failed: $($result.ExitCode)" }
          }
          if (Test-Path -LiteralPath $shortcut) { throw 'MSI removal left its shortcut behind' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guix-install-windows
          path: |
            dist/GuixInstall.exe
            dist/GuixInstall.msi
